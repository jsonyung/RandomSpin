<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fair Ads Spinner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #818cf8;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, #312e81 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
    }

    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }

    .header-row h1 {
      flex: 1;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .settings-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--muted);
      font-size: 1.15rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: -2px;
    }

    .settings-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(99, 102, 241, 0.15);
    }

    .settings-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .field-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: var(--accent); }

    .segmented {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .segmented button {
      flex: 1;
      min-width: 0;
      padding: 0.55rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .segmented button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text);
    }

    .segmented button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .segmented button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .mode-hint {
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .round-info {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .wheel-wrap {
      position: relative;
      width: min(320px, 85vw);
      aspect-ratio: 1;
      margin: 0 auto 1.25rem;
    }

    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #fff;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
      z-index: 10;
    }

    .wheel-rotator {
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    .wheel-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    .wheel-svg text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 800;
      fill: #fff;
      pointer-events: none;
      text-shadow: none;
    }

    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(145deg, var(--accent), #4338ca);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      z-index: 5;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 6px 28px rgba(99, 102, 241, 0.65);
    }

    .spin-btn:active:not(:disabled) {
      transform: translate(-50%, -50%) scale(0.97);
    }

    .spin-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .tally {
      display: grid;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .tally-item {
      text-align: center;
      padding: 0.5rem 0.25rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .tally-name {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tally-count {
      font-size: 1.25rem;
      font-weight: 800;
      margin-top: 0.15rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: linear-gradient(160deg, #1e293b, #0f172a);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .modal.modal-wide {
      max-width: 420px;
      text-align: left;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.show .modal { transform: scale(1); }

    .modal-icon { font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center; }

    .modal-title {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .modal-title-left {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      text-transform: none;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .modal-sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      line-height: 1.45;
    }

    .modal-winner {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .modal-message {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .modal-actions button,
    .name-row button,
    .btn-add-name {
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid var(--border) !important;
    }

    .btn-close:hover { background: rgba(255, 255, 255, 0.18); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35) !important;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
    }

    .btn-danger:hover { background: rgba(239, 68, 68, 0.28); }

    .modal-actions button:active,
    .name-row button:active,
    .btn-add-name:active { transform: scale(0.97); }

    .name-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
      max-height: 240px;
      overflow-y: auto;
    }

    .name-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .name-row input {
      flex: 1;
      padding: 0.6rem 0.75rem;
      font-size: 0.95rem;
    }

    .name-row .btn-remove {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .name-row .btn-remove:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.25);
    }

    .name-row .btn-remove:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-add-name {
      width: 100%;
      background: rgba(99, 102, 241, 0.12);
      color: var(--accent-hover);
      border: 1px dashed rgba(99, 102, 241, 0.45) !important;
      margin-bottom: 1.25rem;
    }

    .btn-add-name:hover { background: rgba(99, 102, 241, 0.22); }

    .settings-error {
      color: #f87171;
      font-size: 0.82rem;
      margin-bottom: 0.75rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-row">
      <h1>Fair Ads Spinner</h1>
      <button type="button" class="settings-btn" id="settingsBtn" title="Settings" aria-label="Open settings">⚙</button>
    </div>
    <p class="subtitle">Let the wheel decide — no arguments</p>

    <div class="field-group">
      <label for="taskInput">Enter Task / Reason to Call</label>
      <input type="text" id="taskInput" placeholder="e.g. Facebook lead, callback request…" autocomplete="off">
    </div>

    <div class="field-group">
      <label>Assignment Mode</label>
      <div class="segmented" id="modeButtons">
        <button type="button" data-mode="fairBag" class="active">Fair Bag</button>
        <button type="button" data-mode="pureRandom">Pure Random</button>
        <button type="button" data-mode="weighted">Weighted</button>
      </div>
      <p class="mode-hint" id="modeHint"></p>
    </div>

    <div class="field-group">
      <label>Spin Speed</label>
      <div class="segmented" id="speedButtons">
        <button type="button" data-speed="quick">Quick</button>
        <button type="button" data-speed="normal" class="active">Normal</button>
        <button type="button" data-speed="dramatic">Dramatic</button>
      </div>
    </div>

    <p class="round-info" id="roundInfo"></p>

    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel-rotator" id="wheelRotator">
        <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 200 200" aria-hidden="true"></svg>
      </div>
      <button type="button" class="spin-btn" id="spinBtn">SPIN</button>
    </div>

    <div class="tally" id="tally"></div>
  </div>

  <div class="modal-overlay" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="modalWinner">
    <div class="modal">
      <div class="modal-icon">🎯</div>
      <p class="modal-title">Result</p>
      <p class="modal-winner" id="modalWinner"></p>
      <p class="modal-message" id="modalMessage"></p>
      <div class="modal-actions">
        <button type="button" class="btn-close" id="modalClose">Close</button>
        <button type="button" class="btn-primary" id="modalAgain">Spin Again</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal modal-wide">
      <p class="modal-title-left" id="settingsTitle">⚙ Team Settings</p>
      <p class="modal-sub">Edit names, add or remove people. Changes save to this browser. Minimum 2, maximum 12.</p>
      <div class="name-list" id="nameList"></div>
      <button type="button" class="btn-add-name" id="addNameBtn">+ Add Person</button>
      <p class="settings-error" id="settingsError"></p>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="resetCountsBtn">Reset Counts</button>
        <button type="button" class="btn-close" id="settingsCancel">Cancel</button>
        <button type="button" class="btn-primary" id="settingsSave">Save</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'fairAdsSpinner_v1';
    const DEFAULT_NAMES = ['Peter', 'Simon', 'Shaun', 'Danny'];
    const MAX_NAMES = 12;
    const MIN_NAMES = 2;
    const SEG_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#ec4899', '#14b8a6', '#f97316', '#06b6d4', '#84cc16', '#e879f9', '#fb7185'];

    const SPEED_CONFIG = {
      quick:    { duration: 1.0, extraTurns: 3 },
      normal:   { duration: 3.5, extraTurns: 6 },
      dramatic: { duration: 5.5, extraTurns: 8 }
    };

    let names = [...DEFAULT_NAMES];

    const state = {
      mode: 'fairBag',
      speed: 'normal',
      currentRotation: 0,
      isSpinning: false,
      wins: {},
      fairBagDeck: [],
      fairBagRound: 1,
      fairBagSpinInRound: 0
    };

    const wheelRotator = document.getElementById('wheelRotator');
    const wheelSvg = document.getElementById('wheelSvg');
    const spinBtn = document.getElementById('spinBtn');
    const taskInput = document.getElementById('taskInput');
    const modeHint = document.getElementById('modeHint');
    const roundInfo = document.getElementById('roundInfo');
    const tallyEl = document.getElementById('tally');
    const resultModal = document.getElementById('resultModal');
    const settingsModal = document.getElementById('settingsModal');
    const modalWinner = document.getElementById('modalWinner');
    const modalMessage = document.getElementById('modalMessage');
    const nameListEl = document.getElementById('nameList');
    const settingsError = document.getElementById('settingsError');

    function getNames() { return names; }

    function modeHintText() {
      const n = names.length;
      const pct = Math.round(100 / n);
      return {
        fairBag: `Shuffled deck — everyone gets exactly 1 per round of ${n}.`,
        pureRandom: `Fresh ${pct}% chance every spin — repeats allowed.`,
        weighted: 'Catch-up mode — fewer wins means higher chance next spin.'
      }[state.mode];
    }

    function updateModeHint() {
      modeHint.textContent = modeHintText();
    }

    function initWins(keepExisting = false) {
      const next = {};
      names.forEach(n => {
        next[n] = keepExisting && state.wins[n] != null ? state.wins[n] : 0;
      });
      state.wins = next;
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ names: [...names] }));
      } catch (_) { /* ignore */ }
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.names) && data.names.length >= MIN_NAMES) {
          names = data.names.map(n => String(n).trim()).filter(Boolean).slice(0, MAX_NAMES);
          if (names.length >= MIN_NAMES) return;
        }
      } catch (_) { /* ignore */ }
      names = [...DEFAULT_NAMES];
    }

    function fisherYates(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initFairBag() {
      state.fairBagDeck = fisherYates(names);
      state.fairBagRound = 1;
      state.fairBagSpinInRound = 0;
    }

    function refillFairBagDeck() {
      state.fairBagDeck = fisherYates(names);
      state.fairBagSpinInRound = 0;
      state.fairBagRound++;
    }

    function pickFairBag() {
      if (state.fairBagDeck.length === 0) refillFairBagDeck();
      state.fairBagSpinInRound++;
      return state.fairBagDeck.shift();
    }

    function pickPureRandom() {
      return names[Math.floor(Math.random() * names.length)];
    }

    function pickWeighted() {
      const weights = names.map(n => 1 / (state.wins[n] + 1));
      const total = weights.reduce((s, w) => s + w, 0);
      let r = Math.random() * total;
      for (let i = 0; i < names.length; i++) {
        r -= weights[i];
        if (r <= 0) return names[i];
      }
      return names[names.length - 1];
    }

    function pickWinner() {
      switch (state.mode) {
        case 'fairBag': return pickFairBag();
        case 'pureRandom': return pickPureRandom();
        case 'weighted': return pickWeighted();
        default: return pickPureRandom();
      }
    }

    function segmentSize() {
      return 360 / names.length;
    }

    function landingAngleForIndex(index) {
      const seg = segmentSize();
      return 360 - index * seg - seg / 2;
    }

    function polarToCartesian(cx, cy, r, deg) {
      const rad = (deg - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function describeArc(cx, cy, r, startDeg, endDeg) {
      const start = polarToCartesian(cx, cy, r, endDeg);
      const end = polarToCartesian(cx, cy, r, startDeg);
      const large = endDeg - startDeg <= 180 ? 0 : 1;
      return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${large} 0 ${end.x} ${end.y} Z`;
    }

    function fitFontSize(name, segDeg) {
      const len = name.length;
      if (segDeg >= 60) return len > 8 ? 11 : len > 5 ? 13 : 15;
      if (segDeg >= 45) return len > 8 ? 9 : len > 5 ? 11 : 13;
      return len > 6 ? 8 : 10;
    }

    function renderWheel() {
      const n = names.length;
      const seg = 360 / n;
      const cx = 100, cy = 100, outerR = 98, innerR = 38;
      let svg = '';

      for (let i = 0; i < n; i++) {
        const start = i * seg;
        const end = (i + 1) * seg;
        const color = SEG_COLORS[i % SEG_COLORS.length];
        svg += `<path d="${describeArc(cx, cy, outerR, start, end)}" fill="${color}" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>`;
      }

      svg += `<circle cx="${cx}" cy="${cy}" r="${innerR}" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>`;

      for (let i = 0; i < n; i++) {
        const mid = (i + 0.5) * seg;
        const pos = polarToCartesian(cx, cy, 68, mid);
        const fs = fitFontSize(names[i], seg);
        let rot = mid;
        if (mid > 90 && mid < 270) rot += 180;
        svg += `<text x="${pos.x}" y="${pos.y}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" transform="rotate(${rot}, ${pos.x}, ${pos.y})">${escapeHtml(names[i])}</text>`;
      }

      wheelSvg.innerHTML = svg;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderTally() {
      tallyEl.style.gridTemplateColumns = `repeat(${Math.min(names.length, 4)}, 1fr)`;
      tallyEl.innerHTML = names.map((name, i) => `
        <div class="tally-item">
          <div class="tally-name">${escapeHtml(name)}</div>
          <div class="tally-count" style="color:${SEG_COLORS[i % SEG_COLORS.length]}">${state.wins[name]}</div>
        </div>
      `).join('');
    }

    function updateRoundInfo() {
      if (state.mode === 'fairBag') {
        const spin = state.fairBagSpinInRound === 0 ? 1 : state.fairBagSpinInRound;
        roundInfo.textContent = `Round ${state.fairBagRound} · spin ${spin} of ${names.length}`;
      } else {
        roundInfo.textContent = '';
      }
    }

    function setControlsDisabled(disabled) {
      spinBtn.disabled = disabled;
      document.getElementById('settingsBtn').disabled = disabled;
      document.querySelectorAll('#modeButtons button, #speedButtons button').forEach(btn => {
        btn.disabled = disabled;
      });
    }

    function showResultModal(winner, task) {
      const taskLabel = task.trim() || 'this lead';
      modalWinner.textContent = winner;
      modalMessage.textContent = `${winner} has been chosen for ${taskLabel}!`;
      resultModal.classList.add('show');
    }

    function hideResultModal() {
      resultModal.classList.remove('show');
    }

    function spin() {
      if (state.isSpinning || names.length < MIN_NAMES) return;

      const winner = pickWinner();
      const winnerIndex = names.indexOf(winner);
      const { duration, extraTurns } = SPEED_CONFIG[state.speed];

      const landing = landingAngleForIndex(winnerIndex);
      const currentMod = state.currentRotation % 360;
      let delta = landing - currentMod;
      if (delta <= 0) delta += 360;

      const targetRotation = state.currentRotation + 360 * extraTurns + delta;
      state.isSpinning = true;
      setControlsDisabled(true);

      wheelRotator.style.transition = `transform ${duration}s cubic-bezier(0.17, 0.67, 0.12, 0.99)`;
      wheelRotator.style.transform = `rotate(${targetRotation}deg)`;
      state.currentRotation = targetRotation;

      const onEnd = (e) => {
        if (e.propertyName !== 'transform') return;
        wheelRotator.removeEventListener('transitionend', onEnd);

        state.wins[winner]++;
        renderTally();
        updateRoundInfo();
        showResultModal(winner, taskInput.value);

        state.isSpinning = false;
        setControlsDisabled(false);
      };

      wheelRotator.addEventListener('transitionend', onEnd);
    }

    function renderSettingsList() {
      nameListEl.innerHTML = '';
      settingsDraft.forEach((name, idx) => {
        const row = document.createElement('div');
        row.className = 'name-row';
        row.innerHTML = `
          <input type="text" value="${escapeHtml(name)}" data-idx="${idx}" maxlength="24" aria-label="Person name">
          <button type="button" class="btn-remove" data-idx="${idx}" title="Remove" ${settingsDraft.length <= MIN_NAMES ? 'disabled' : ''}>×</button>
        `;
        nameListEl.appendChild(row);
      });
    }

    let settingsDraft = [];

    function openSettings() {
      if (state.isSpinning) return;
      settingsDraft = [...names];
      settingsError.textContent = '';
      renderSettingsList();
      settingsModal.classList.add('show');
    }

    function closeSettings() {
      settingsModal.classList.remove('show');
      settingsError.textContent = '';
    }

    function validateNames(list) {
      const trimmed = list.map(n => n.trim()).filter(Boolean);
      if (trimmed.length < MIN_NAMES) return 'Need at least 2 names.';
      if (trimmed.length > MAX_NAMES) return `Maximum ${MAX_NAMES} names.`;
      const lower = trimmed.map(n => n.toLowerCase());
      if (new Set(lower).size !== lower.length) return 'Names must be unique.';
      return null;
    }

    function applyNames(newNames) {
      names = newNames;
      initWins(true);
      initFairBag();
      state.currentRotation = 0;
      wheelRotator.style.transition = 'none';
      wheelRotator.style.transform = 'rotate(0deg)';
      void wheelRotator.offsetHeight;
      wheelRotator.style.transition = '';
      renderWheel();
      renderTally();
      updateRoundInfo();
      updateModeHint();
      saveToStorage();
    }

    function collectDraftNames() {
      return [...nameListEl.querySelectorAll('.name-row input')].map(inp => inp.value);
    }

    nameListEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-remove');
      if (!btn || btn.disabled) return;
      settingsDraft = collectDraftNames();
      settingsDraft.splice(Number(btn.dataset.idx), 1);
      renderSettingsList();
    });

    document.getElementById('addNameBtn').addEventListener('click', () => {
      settingsDraft = collectDraftNames();
      if (settingsDraft.length >= MAX_NAMES) {
        settingsError.textContent = `Maximum ${MAX_NAMES} names.`;
        return;
      }
      settingsDraft.push('');
      settingsError.textContent = '';
      renderSettingsList();
      const inputs = nameListEl.querySelectorAll('input');
      inputs[inputs.length - 1].focus();
    });

    document.getElementById('settingsSave').addEventListener('click', () => {
      const draft = collectDraftNames();
      const err = validateNames(draft);
      if (err) {
        settingsError.textContent = err;
        return;
      }
      applyNames(draft.map(n => n.trim()));
      closeSettings();
    });

    document.getElementById('resetCountsBtn').addEventListener('click', () => {
      names.forEach(n => { state.wins[n] = 0; });
      initFairBag();
      renderTally();
      updateRoundInfo();
      settingsError.textContent = 'Session counts reset.';
    });

    document.getElementById('settingsBtn').addEventListener('click', openSettings);
    document.getElementById('settingsCancel').addEventListener('click', closeSettings);

    document.getElementById('modeButtons').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-mode]');
      if (!btn || state.isSpinning) return;
      state.mode = btn.dataset.mode;
      document.querySelectorAll('#modeButtons button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateModeHint();
      updateRoundInfo();
    });

    document.getElementById('speedButtons').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-speed]');
      if (!btn || state.isSpinning) return;
      state.speed = btn.dataset.speed;
      document.querySelectorAll('#speedButtons button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });

    spinBtn.addEventListener('click', spin);
    document.getElementById('modalClose').addEventListener('click', hideResultModal);
    document.getElementById('modalAgain').addEventListener('click', () => {
      hideResultModal();
      spin();
    });

    resultModal.addEventListener('click', (e) => {
      if (e.target === resultModal) hideResultModal();
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) closeSettings();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideResultModal();
        closeSettings();
      }
    });

    loadFromStorage();
    initWins();
    initFairBag();
    renderWheel();
    renderTally();
    updateRoundInfo();
    updateModeHint();
  </script>
</body>
</html>
